name: wally-analyzer

services:
  app-server:
    build:
      context: .
      dockerfile: app-server/Dockerfile
    environment:
      PORT: "3000"
      NODE_ENV: development
      NODE_SERVER_PATH: /app/local.js
      PSIU_BASE_URL: "${PSIU_BASE_URL:-http://psiu.local}"
      PSIU_CREDENTIAL_SECRET_ARN: "${PSIU_CREDENTIAL_SECRET_ARN:?PSIU_CREDENTIAL_SECRET_ARN must reference an AWS Secrets Manager secret}"
      DATABASE_SECRET_ARN: "${DATABASE_SECRET_ARN:?DATABASE_SECRET_ARN must reference an AWS Secrets Manager secret}"
      DATABASE_PROXY_HOST: postgres
      DATABASE_NAME: "${POSTGRES_DB:-wally}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
    volumes:
      - "${HOME}/.aws:/root/.aws:ro"
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build:
      context: .
      dockerfile: app-server/docker/postgres.Dockerfile
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-wally}"
      POSTGRES_USER: "${POSTGRES_USER:-wally}"
      DATABASE_SECRET_ARN: "${DATABASE_SECRET_ARN:?DATABASE_SECRET_ARN must reference an AWS Secrets Manager secret}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_PROFILE: "${AWS_PROFILE:-default}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - "${HOME}/.aws:/root/.aws:ro"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5431}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
