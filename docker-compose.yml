name: wally-analyzer

services:
  app-server:
    build:
      context: .
      dockerfile: app-server/Dockerfile
    environment:
      PORT: "3000"
      NODE_ENV: development
      NODE_SERVER_PATH: /app/local.js
      PSIU_BASE_URL: "${PSIU_BASE_URL:-http://psiu.local}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-wally}:${POSTGRES_PASSWORD:-wally_local_password}@postgres:5432/${POSTGRES_DB:-wally}"
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:80"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-wally}"
      POSTGRES_USER: "${POSTGRES_USER:-wally}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-wally_local_password}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5431}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
